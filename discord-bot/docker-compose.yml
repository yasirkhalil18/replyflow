version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discord_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: discord_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: discord_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/discord_saas?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discord_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: discord_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: discord_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: discord_grafana
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./monitoring/grafana.ini:/etc/grafana/grafana.ini:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
